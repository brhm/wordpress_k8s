apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql:3306
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-secrets
                  key: wordpress-db-password
            - name: WORDPRESS_DB_NAME
              value: wordpress
               # --- for session static (for all  pods it will be same) ---
            - name: WORDPRESS_AUTH_KEY
              value: "sabit-deger-1-degistir"
            - name: WORDPRESS_SECURE_AUTH_KEY
              value: "sabit-deger-2-degistir"
            - name: WORDPRESS_LOGGED_IN_KEY
              value: "sabit-deger-3-degistir"
            - name: WORDPRESS_NONCE_KEY
              value: "sabit-deger-4-degistir"
            - name: WORDPRESS_AUTH_SALT
              value: "sabit-deger-5-degistir"
            - name: WORDPRESS_SECURE_AUTH_SALT
              value: "sabit-deger-6-degistir"
            - name: WORDPRESS_LOGGED_IN_SALT
              value: "sabit-deger-7-degistir"
            - name: WORDPRESS_NONCE_SALT
              value: "sabit-deger-8-degistir"
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html         # tüm WP dosyaları paylaşımlı diskte
      volumes:
       - name: wordpress-data
         persistentVolumeClaim:
            claimName: wordpress-rwx-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
spec:
  type: LoadBalancer
  selector:
    app: wordpress
  ports:
    - name: http
      port: 80
      targetPort: 80
